services:
  datajohei:
    build: .
    image: datajohei:latest
    ports:
      - "8501:8501"
    restart: unless-stopped
    # Memory cap sized well above the 100MB upload limit so large
    # uploads plus Streamlit overhead stay bounded in production.
    mem_limit: 1g
    # Mirrors Dockerfile HEALTHCHECK (Streamlit /_stcore/health endpoint).
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('STREAMLIT_SERVER_PORT', '8501') + '/_stcore/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Server behavior (headless mode, 100MB upload cap) comes from .streamlit/config.toml
    # baked into the image. Override the host port with e.g. "9000:8501".
